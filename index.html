<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的周计划</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef2f9;
    --card:#ffffff;
    --line:#e7ebf3;
    --text:#1c2333;
    --muted:#8b95a7;
    --primary:#6366f1;
    --primary-2:#8b5cf6;
    --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
    --green:#10b981;
    --red:#ef4444;
    --radius:16px;
    --shadow:0 1px 2px rgba(24,32,52,.04),0 8px 28px rgba(24,32,52,.07);
    --shadow-lg:0 12px 40px rgba(24,32,52,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 500px at 15% -10%,#e9ecff 0%,transparent 55%),
      radial-gradient(1000px 500px at 100% 0%,#f3eaff 0%,transparent 50%),
      var(--bg);
    color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;
  }
  .app{max-width:1180px;margin:0 auto;padding:18px 16px 96px}

  /* ===== 顶部 banner ===== */
  .banner{
    position:relative;overflow:hidden;
    background:var(--grad);color:#fff;border-radius:22px;
    padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-lg);
  }
  .banner::before,.banner::after{
    content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);
  }
  .banner::before{width:220px;height:220px;right:-60px;top:-100px}
  .banner::after{width:140px;height:140px;right:120px;bottom:-70px;background:rgba(255,255,255,.09)}
  .banner-inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);
    backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
  .brand .sub{margin-top:3px;font-size:13px;color:rgba(255,255,255,.82)}
  .brand .sub b{font-weight:700;color:#fff}
  .nav{display:flex;align-items:center;gap:8px}
  .nav .arrow{
    width:38px;height:38px;border:none;border-radius:12px;cursor:pointer;font-size:22px;line-height:1;
    background:rgba(255,255,255,.16);color:#fff;transition:.15s;display:flex;align-items:center;justify-content:center;
  }
  .nav .arrow:hover{background:rgba(255,255,255,.28)}
  .nav .arrow:active{transform:scale(.94)}
  .nav .today-pill{
    border:none;border-radius:12px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;
    background:#fff;color:var(--primary);
  }
  .nav .today-pill:hover{transform:translateY(-1px)}

  /* ===== 工具栏 ===== */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;
    padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;box-shadow:var(--shadow);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
  .btn.primary:hover{box-shadow:0 8px 24px rgba(99,102,241,.45)}
  .btn.icon{padding:9px 12px}
  .status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;padding:0 4px}
  .dot{width:8px;height:8px;border-radius:50%;background:#c4ccd9;box-shadow:0 0 0 3px rgba(196,204,217,.25)}
  .dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.2)}
  .dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.18)}

  /* ===== 周视图 ===== */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
  .day{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:430px;overflow:hidden;transition:.15s;
  }
  .day:hover{box-shadow:var(--shadow-lg)}
  .day.today{border-color:transparent;box-shadow:0 0 0 2px var(--primary),0 12px 32px rgba(99,102,241,.16)}
  .day-head{padding:14px 10px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .day-head .dow{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px}
  .day-head .date-badge{
    width:34px;height:34px;border-radius:50%;margin:6px auto 0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--text);background:#f1f4f9;
  }
  .day.today .date-badge{background:var(--grad);color:#fff;box-shadow:0 4px 10px rgba(99,102,241,.4)}
  .day-body{flex:1;padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
  .day-foot{padding:8px;border-top:1px solid var(--line)}

  /* ===== 任务卡片 ===== */
  .task{
    background:#f7f9fc;border:1px solid var(--line);border-left:3px solid var(--primary);
    border-radius:11px;padding:8px 30px 8px 10px;cursor:pointer;position:relative;transition:.14s;
  }
  .task:hover{border-color:#d5dce8;background:#f1f4fa;transform:translateY(-1px)}
  .task-title{font-size:13.5px;font-weight:600;word-break:break-word;padding-right:2px}
  .task-meta{margin-top:3px}
  .time-chip{display:inline-block;background:#e9edf8;color:var(--primary);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .task-note{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-word}
  .task.done{opacity:.6}
  .task.done .task-title{text-decoration:line-through;color:var(--muted)}
  .task .check{
    position:absolute;top:8px;right:8px;width:19px;height:19px;border-radius:50%;
    border:2px solid #c6cedd;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;transition:.15s;
  }
  .task.done .check{background:var(--green);border-color:var(--green)}
  .task .del{position:absolute;bottom:6px;right:8px;color:var(--muted);font-size:12px;opacity:0;transition:.13s;font-weight:700}
  .task:hover .del{opacity:.65}
  .task .del:hover{opacity:1;color:var(--red)}

  /* 每天不同点缀色 */
  .task.c1{border-left-color:#6366f1}.task.c1 .time-chip{background:#e9edfd;color:#6366f1}
  .task.c2{border-left-color:#8b5cf6}.task.c2 .time-chip{background:#f0eafd;color:#8b5cf6}
  .task.c3{border-left-color:#06b6d4}.task.c3 .time-chip{background:#e4f7fb;color:#0891b2}
  .task.c4{border-left-color:#10b981}.task.c4 .time-chip{background:#e4f8f0;color:#0e9f6e}
  .task.c5{border-left-color:#f59e0b}.task.c5 .time-chip{background:#fdf3e2;color:#d97706}
  .task.c6{border-left-color:#f43f5e}.task.c6 .time-chip{background:#fde8ec;color:#e11d48}
  .task.c7{border-left-color:#64748b}.task.c7 .time-chip{background:#edf1f5;color:#64748b}

  .add-day{
    width:100%;background:transparent;border:1px dashed #ccd4e2;border-radius:10px;padding:7px;
    color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .add-day:hover{color:var(--primary);border-color:var(--primary);background:#f4f6ff}
  .empty-hint{color:#c0c8d6;font-size:12px;text-align:center;padding:26px 4px;letter-spacing:.5px}

  /* ===== 移动端 ===== */
  .day-tabs{display:none}
  @media (max-width:820px){
    .week{display:none}
    .day-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;scrollbar-width:none}
    .day-tabs::-webkit-scrollbar{display:none}
    .day-tabs button{
      flex:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 15px;
      cursor:pointer;font-family:inherit;box-shadow:var(--shadow);min-width:64px;
    }
    .day-tabs button .dow{display:block;font-size:11px;color:var(--muted);font-weight:600}
    .day-tabs button .dt{font-weight:800;font-size:15px}
    .day-tabs button.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
    .day-tabs button.active .dow{color:rgba(255,255,255,.8)}
    .mobile-day{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:440px;padding:16px}
    .mobile-day .m-title{font-weight:800;font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .mobile-day .m-title .tag{background:var(--grad);color:#fff;border-radius:7px;font-size:11px;padding:2px 8px;font-weight:700}
  }

  /* ===== 弹窗 ===== */
  .mask{position:fixed;inset:0;background:rgba(22,28,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;max-height:90vh;overflow:auto;animation:pop .2s ease}
  @keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{background:var(--grad);color:#fff;padding:18px 22px;border-radius:20px 20px 0 0}
  .modal-head h2{margin:0;font-size:18px;font-weight:800}
  .modal-head p{margin:5px 0 0;font-size:12.5px;color:rgba(255,255,255,.85)}
  .modal-body{padding:20px 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;
    font-family:inherit;background:#fbfcfe;transition:.15s;color:var(--text);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
  .field textarea{min-height:64px;resize:vertical}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .list-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:#fbfcfe}
  .list-item .info{flex:1;min-width:0}
  .list-item .t{font-size:14px;font-weight:700}
  .list-item .s{font-size:12px;color:var(--muted);margin-top:1px}
  .tpl-day{background:var(--grad);color:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap}
  .switch{position:relative;width:42px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .sl{position:absolute;inset:0;background:#cfd6e2;border-radius:24px;transition:.2s;cursor:pointer}
  .switch .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .sl{background:var(--green)}
  .switch input:checked + .sl:before{transform:translateX(18px)}
  .icon-btn{border:none;background:transparent;cursor:pointer;font-size:16px;color:var(--muted);padding:5px 7px;border-radius:8px;transition:.13s}
  .icon-btn:hover{background:#eef1f7;color:var(--text)}
  .icon-btn.danger:hover{background:#fdeaea;color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="banner">
    <div class="banner-inner">
      <div class="brand">
        <div class="logo">周</div>
        <div>
          <h1>我的周计划</h1>
          <div class="sub"><b id="weekRange"></b> &nbsp;·&nbsp; <span id="weekStat"></span></div>
        </div>
      </div>
      <div class="nav">
        <button class="arrow" id="prevBtn" title="上一周">‹</button>
        <button class="today-pill" id="todayBtn">本周</button>
        <button class="arrow" id="nextBtn" title="下一周">›</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="newTaskBtn">＋ 新建任务</button>
    <button class="btn" id="tplBtn">模板管理</button>
    <button class="btn" id="applyTplBtn">应用模板到本周</button>
    <div class="spacer"></div>
    <div class="status" id="status"><span class="dot" id="statusDot"></span><span id="statusText">未连接</span></div>
    <button class="btn icon" id="settingsBtn" title="云端同步设置">⚙ 设置</button>
  </div>

  <div class="week" id="weekGrid"></div>

  <div class="day-tabs" id="dayTabs"></div>
  <div class="mobile-day" id="mobileDay" style="display:none"></div>
</div>

<!-- 任务编辑弹窗 -->
<div class="mask" id="taskMask">
  <div class="modal">
    <div class="modal-head"><h2 id="taskTitle">新建任务</h2></div>
    <div class="modal-body">
      <div class="field">
        <label>任务名称</label>
        <input id="t_title" placeholder="例如：复习高数第 3 章">
      </div>
      <div class="row2">
        <div class="field">
          <label>日期</label>
          <input id="t_date" type="date">
        </div>
        <div class="field">
          <label>时间（可选）</label>
          <input id="t_time" placeholder="如 08:00 或 08:00-09:30">
        </div>
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <textarea id="t_note" placeholder="补充说明…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" id="taskCancel">取消</button>
        <button class="btn primary" id="taskSave">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 模板管理弹窗 -->
<div class="mask" id="tplMask">
  <div class="modal" style="max-width:470px">
    <div class="modal-head">
      <h2>每周固定项模板</h2>
      <p>固定重复的事（如课程）存这里，新的一周点「应用模板」一键生成，不用重复填写。</p>
    </div>
    <div class="modal-body">
      <div id="tplList"></div>
      <button class="btn" style="width:100%" id="addTplBtn">＋ 新增模板</button>
      <div id="tplForm" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
        <div class="field"><label>名称</label><input id="p_title" placeholder="如：线性代数"></div>
        <div class="row2">
          <div class="field"><label>星期</label>
            <select id="p_weekday">
              <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
              <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
            </select>
          </div>
          <div class="field"><label>时间（可选）</label><input id="p_time" placeholder="08:00"></div>
        </div>
        <div class="field"><label>备注（可选）</label><input id="p_note" placeholder="地点 / 说明"></div>
        <div class="modal-actions">
          <button class="btn" id="pCancel">取消</button>
          <button class="btn primary" id="pSave">保存</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="tplClose">关闭</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask" id="settingsMask">
  <div class="modal">
    <div class="modal-head">
      <h2>云端同步设置</h2>
      <p>填入 Supabase 连接信息，手机和电脑自动同步；不填则仅保存在当前设备。</p>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Project URL</label>
        <input id="s_url" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="field">
        <label>anon public key</label>
        <textarea id="s_key" placeholder="eyJhbGciOi…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" id="settingsCancel">取消</button>
        <button class="btn primary" id="settingsSave">保存并连接</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ 配置 ============ */
const STORE_KEY = 'weekplan_v1';

/* ============ 工具函数 ============ */
function pad(n){return String(n).padStart(2,'0')}
function toISOWeekday(d){let w=d.getDay();return w===0?7:w}
function getMonday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(toISOWeekday(x)-1));x.setHours(0,0,0,0);return x}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){let x=new Date();x.setHours(0,0,0,0);return x}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function weekNumber(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=x.getUTCDay()||7;
  x.setUTCDate(x.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil((((x-yearStart)/86400000)+1)/7);
}
const WEEKDAY_CN={1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',7:'周日'};

/* ============ 状态 ============ */
let currentMonday = getMonday(today());
let state = { templates: [], tasks: [] };
let supabaseClient = null;
let editingTaskId = null;
let editingTplId = null;

/* ============ Supabase / 本地存储 ============ */
function getConfig(){try{return JSON.parse(localStorage.getItem('weekplan_config')||'null')}catch(e){return null}}
function setConfig(c){localStorage.setItem('weekplan_config',JSON.stringify(c))}
const DEFAULT_CONFIG = {url:'https://fqgpohpavvkobbntizyf.supabase.co', key:'sb_publishable_ytef3va_7ICP9Gwurqx54g_ukeqVhna'};
function initClient(){
  const c=getConfig() || DEFAULT_CONFIG;
  if(c && c.url && c.key){
    try{supabaseClient = supabase.createClient(c.url, c.key);return true}catch(e){supabaseClient=null}
  }
  return false;
}
function localGet(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{"templates":[],"tasks":[]}')}catch(e){return {templates:[],tasks:[]}}}
function localSet(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}

async function loadAll(){
  if(supabaseClient){
    try{
      const [tr,ta]=await Promise.all([
        supabaseClient.from('weekly_templates').select('*').order('weekday').order('time'),
        supabaseClient.from('weekly_tasks').select('*').order('date').order('time')
      ]);
      if(tr.error||ta.error) throw (tr.error||ta.error);
      state.templates = tr.data||[];
      state.tasks = ta.data||[];
      setStatus(true);
    }catch(e){
      console.error(e);
      state = localGet();
      setStatus(false);
    }
  }else{
    state = localGet();
    setStatus(false);
  }
  render();
}
function setStatus(on){
  const dot=document.getElementById('statusDot');
  const txt=document.getElementById('statusText');
  if(supabaseClient && on){dot.className='dot on';txt.textContent='已同步云端'}
  else if(supabaseClient && !on){dot.className='dot off';txt.textContent='同步失败'}
  else {dot.className='dot';txt.textContent='仅本机'}
}

/* ============ 持久化操作 ============ */
async function persist(fn){
  if(supabaseClient){try{await fn(supabaseClient);setStatus(true)}catch(e){console.error(e)}}
  localSet();
}

/* ============ 渲染 ============ */
function render(){
  renderHeader();
  renderGrid();
  renderTabs();
  renderTplList();
}

function weekDates(){
  const arr=[];
  for(let i=0;i<7;i++){const d=new Date(currentMonday);d.setDate(d.getDate()+i);arr.push(d)}
  return arr;
}
function renderHeader(){
  const ds=weekDates();
  const end=ds[6];
  const startStr=fmtDate(currentMonday), endStr=fmtDate(end);
  const wk=weekNumber(currentMonday);
  const weekTasks=state.tasks.filter(t=>t.date>=startStr && t.date<=endStr);
  const done=weekTasks.filter(t=>t.done).length;
  document.getElementById('weekRange').textContent =
    (currentMonday.getMonth()+1)+'月'+currentMonday.getDate()+'日 — '+(end.getMonth()+1)+'月'+end.getDate()+'日 · 第'+wk+'周';
  document.getElementById('weekStat').textContent = '本周 '+weekTasks.length+' 项 · 完成 '+done+' 项';
}

function tasksOn(date){return state.tasks.filter(t=>t.date===date)}
function taskHtml(t){
  const d=new Date(t.date+'T00:00:00');
  const wd=isNaN(d.getTime())?1:toISOWeekday(d);
  const time=t.time?`<span class="time-chip">${escapeHtml(t.time)}</span>`:'';
  const note=t.note?`<div class="task-note">${escapeHtml(t.note)}</div>`:'';
  return `<div class="task c${wd} ${t.done?'done':''}" data-id="${t.id}">
    <div class="task-title">${escapeHtml(t.title)}</div>
    ${time?`<div class="task-meta">${time}</div>`:''}
    ${note}
    <span class="check" data-act="check">${t.done?'✓':''}</span>
    <span class="del" data-act="del">✕</span>
  </div>`;
}

function renderGrid(){
  const grid=document.getElementById('weekGrid');
  const ds=weekDates();
  const now=today();
  grid.innerHTML = ds.map((d,i)=>{
    const dsStr=fmtDate(d);
    const list=tasksOn(dsStr);
    const isToday=sameDay(d,now);
    return `<div class="day ${isToday?'today':''}" data-date="${dsStr}">
      <div class="day-head"><div class="dow">${WEEKDAY_CN[i+1]}</div><div class="date-badge">${d.getDate()}</div></div>
      <div class="day-body">${list.length?list.map(taskHtml).join(''):'<div class="empty-hint">暂无安排</div>'}</div>
      <div class="day-foot"><button class="add-day" data-date="${dsStr}">＋ 添加</button></div>
    </div>`;
  }).join('');
}

function renderTabs(){
  const isMobile=window.innerWidth<=820;
  if(!isMobile){document.getElementById('dayTabs').style.display='none';document.getElementById('mobileDay').style.display='none';return}
  document.getElementById('dayTabs').style.display='flex';
  document.getElementById('mobileDay').style.display='block';
  const ds=weekDates();
  const now=today();
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML=ds.map((d,i)=>{
    const isToday=sameDay(d,now);
    return `<button data-idx="${i}" class="${isToday?'active':''}">
      <span class="dow">${WEEKDAY_CN[i+1]}</span>
      <span class="dt">${d.getDate()}</span>
    </button>`;
  }).join('');
  let activeIdx=ds.findIndex(d=>sameDay(d,now));
  if(activeIdx<0) activeIdx=0;
  renderMobileDay(activeIdx);
}
function renderMobileDay(idx){
  const ds=weekDates();
  const d=ds[idx];const dsStr=fmtDate(d);
  const now=today();const isToday=sameDay(d,now);
  const list=tasksOn(dsStr);
  const el=document.getElementById('mobileDay');
  el.innerHTML=`<div class="m-title">${WEEKDAY_CN[idx+1]} ${d.getMonth()+1}月${d.getDate()}日 ${isToday?'<span class="tag">今天</span>':''}</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    ${list.length?list.map(taskHtml).join(''):'<div class="empty-hint">暂无安排</div>'}
    <button class="add-day" data-date="${dsStr}">＋ 添加任务</button>
  </div>`;
}

function renderTplList(){
  const el=document.getElementById('tplList');
  if(!state.templates.length){el.innerHTML='<div class="empty-hint">还没有模板，点下面新增</div>';return}
  el.innerHTML=state.templates.map(t=>`
    <div class="list-item">
      <span class="tpl-day">${WEEKDAY_CN[t.weekday]}</span>
      <div class="info">
        <div class="t">${escapeHtml(t.title)}${t.time?` <span class="time-chip">${escapeHtml(t.time)}</span>`:''}</div>
        ${t.note?`<div class="s">${escapeHtml(t.note)}</div>`:''}
      </div>
      <label class="switch"><input type="checkbox" data-id="${t.id}" data-act="toggle" ${t.active===false?'':'checked'}><span class="sl"></span></label>
      <button class="icon-btn" data-id="${t.id}" data-act="editTpl" title="编辑">✎</button>
      <button class="icon-btn danger" data-id="${t.id}" data-act="delTpl" title="删除">✕</button>
    </div>`).join('');
}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ============ 事件 ============ */
document.addEventListener('click', async e=>{
  const t=e.target;
  const act=t.getAttribute&&t.getAttribute('data-act');

  if(t.closest('#prevBtn')){currentMonday=new Date(currentMonday);currentMonday.setDate(currentMonday.getDate()-7);render()}
  else if(t.closest('#nextBtn')){currentMonday=new Date(currentMonday);currentMonday.setDate(currentMonday.getDate()+7);render()}
  else if(t.closest('#todayBtn')){currentMonday=getMonday(today());render()}

  else if(t.closest('#newTaskBtn')){openTaskModal(null,null)}
  else if(t.closest('.add-day')){openTaskModal(t.getAttribute('data-date'),null)}

  else if(act==='check'){
    const id=t.closest('.task').getAttribute('data-id');
    const task=state.tasks.find(x=>x.id===id);
    if(task){task.done=!task.done;await persist(async c=>{await c.from('weekly_tasks').update({done:task.done}).eq('id',id)});render()}
  }
  else if(act==='del'){
    const id=t.closest('.task').getAttribute('data-id');
    state.tasks=state.tasks.filter(x=>x.id!==id);
    await persist(async c=>{await c.from('weekly_tasks').delete().eq('id',id)});
    render();
  }
  else if(t.closest('.task') && !act){
    const id=t.closest('.task').getAttribute('data-id');
    const task=state.tasks.find(x=>x.id===id);
    openTaskModal(task.date, task);
  }

  else if(t.closest('#tplBtn')){document.getElementById('tplMask').classList.add('show');renderTplList()}
  else if(t.closest('#tplClose')){document.getElementById('tplMask').classList.remove('show')}
  else if(t.closest('#addTplBtn')){editingTplId=null;showTplForm(true)}
  else if(t.closest('#pCancel')){showTplForm(false)}
  else if(t.closest('#pSave')){saveTemplate()}
  else if(act==='toggle'){
    const id=t.getAttribute('data-id');
    const tpl=state.templates.find(x=>x.id===id);
    if(tpl){tpl.active=!tpl.active;await persist(async c=>{await c.from('weekly_templates').update({active:tpl.active}).eq('id',id)});renderTplList()}
  }
  else if(act==='delTpl'){
    const id=t.getAttribute('data-id');
    state.templates=state.templates.filter(x=>x.id!==id);
    await persist(async c=>{await c.from('weekly_templates').delete().eq('id',id)});
    renderTplList();
  }
  else if(act==='editTpl'){
    const id=t.getAttribute('data-id');
    const tpl=state.templates.find(x=>x.id===id);
    if(tpl){editingTplId=id;document.getElementById('p_title').value=tpl.title;document.getElementById('p_weekday').value=tpl.weekday;document.getElementById('p_time').value=tpl.time||'';document.getElementById('p_note').value=tpl.note||'';showTplForm(true)}
  }

  else if(t.closest('#applyTplBtn')){await applyTemplates()}

  else if(t.closest('#settingsBtn')){openSettings()}
  else if(t.closest('#settingsCancel')){document.getElementById('settingsMask').classList.remove('show')}
  else if(t.closest('#settingsSave')){saveSettings()}

  else if(t.classList.contains('mask')){t.classList.remove('show')}
  else if(t.closest('#dayTabs button')){renderMobileDay(Number(t.getAttribute('data-idx')))}
});

document.getElementById('dayTabs').addEventListener('click', e=>{
  const b=e.target.closest('button');
  if(!b)return;
  document.querySelectorAll('#dayTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
});

/* ============ 任务弹窗 ============ */
function openTaskModal(date, task){
  editingTaskId = task?task.id:null;
  document.getElementById('taskTitle').textContent = task?'编辑任务':'新建任务';
  document.getElementById('t_title').value = task?task.title:'';
  document.getElementById('t_date').value = date || fmtDate(today());
  document.getElementById('t_time').value = task?task.time||'':'';
  document.getElementById('t_note').value = task?task.note||'':'';
  document.getElementById('taskMask').classList.add('show');
  document.getElementById('t_title').focus();
}
async function saveTask(){
  const title=document.getElementById('t_title').value.trim();
  const date=document.getElementById('t_date').value;
  const time=document.getElementById('t_time').value.trim();
  const note=document.getElementById('t_note').value.trim();
  if(!title){alert('请填写任务名称');return}
  if(!date){alert('请选择日期');return}
  if(editingTaskId){
    const task=state.tasks.find(x=>x.id===editingTaskId);
    if(task){Object.assign(task,{title,date,time,note});
      await persist(async c=>{await c.from('weekly_tasks').update({title,date,time,note}).eq('id',editingTaskId)});}
  }else{
    const task={id:uid(),title,date,time,note,done:false};
    state.tasks.push(task);
    await persist(async c=>{await c.from('weekly_tasks').insert(task)});
  }
  document.getElementById('taskMask').classList.remove('show');
  render();
}
document.getElementById('taskSave').addEventListener('click',saveTask);
document.getElementById('taskCancel').addEventListener('click',()=>document.getElementById('taskMask').classList.remove('show'));
document.getElementById('t_title').addEventListener('keydown',e=>{if(e.key==='Enter')saveTask()});

/* ============ 模板 ============ */
function showTplForm(show){document.getElementById('tplForm').style.display=show?'block':'none';if(show&&!editingTplId){document.getElementById('p_title').value='';document.getElementById('p_time').value='';document.getElementById('p_note').value='';}}
async function saveTemplate(){
  const title=document.getElementById('p_title').value.trim();
  const weekday=Number(document.getElementById('p_weekday').value);
  const time=document.getElementById('p_time').value.trim();
  const note=document.getElementById('p_note').value.trim();
  if(!title){alert('请填写名称');return}
  if(editingTplId){
    const tpl=state.templates.find(x=>x.id===editingTplId);
    if(tpl){Object.assign(tpl,{title,weekday,time,note});
      await persist(async c=>{await c.from('weekly_templates').update({title,weekday,time,note}).eq('id',editingTplId)});}
  }else{
    const tpl={id:uid(),title,weekday,time,note,active:true};
    state.templates.push(tpl);
    await persist(async c=>{await c.from('weekly_templates').insert(tpl)});
  }
  showTplForm(false);renderTplList();
}

async function applyTemplates(){
  const activeTpls=state.templates.filter(t=>t.active!==false);
  if(!activeTpls.length){alert('没有启用的模板，请先在「模板管理」里添加');return}
  const ds=weekDates();
  let added=0;
  for(const tpl of activeTpls){
    const d=ds[tpl.weekday-1];
    const dsStr=fmtDate(d);
    const dup=state.tasks.find(x=>x.date===dsStr && x.title===tpl.title && x.time===tpl.time);
    if(dup)continue;
    const task={id:uid(),title:tpl.title,date:dsStr,time:tpl.time||'',note:tpl.note||'',done:false};
    state.tasks.push(task);
    if(supabaseClient){try{await supabaseClient.from('weekly_tasks').insert(task)}catch(e){console.error(e)}}
    added++;
  }
  localSet();
  render();
  alert(added>0?`已生成 ${added} 条安排到本周`:'本周这些安排已存在，无需重复生成');
}

/* ============ 设置 ============ */
function openSettings(){
  const c=getConfig()||{};
  document.getElementById('s_url').value=c.url||'';
  document.getElementById('s_key').value=c.key||'';
  document.getElementById('settingsMask').classList.add('show');
}
async function saveSettings(){
  const url=document.getElementById('s_url').value.trim();
  const key=document.getElementById('s_key').value.trim();
  if(url&&key){setConfig({url,key})}else{setConfig(null)}
  document.getElementById('settingsMask').classList.remove('show');
  await reload();
}
async function reload(){
  initClient();
  await loadAll();
  if(supabaseClient){alert('已连接云端，数据已同步');}
}

/* ============ 工具 ============ */
function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2))}

/* ============ 初始化 ============ */
window.addEventListener('resize',render);
initClient();
loadAll();
</script>
